<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة إضاءة السيارة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#f2f2f2;--ink:#101820;--mute:#5b6670;--line:#dcdfe3;--blue:#0566e8;--blue2:#0a4fb4;--sheet:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;display:flex;justify-content:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.app{width:100%;max-width:560px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:18px;padding:12px 0 24px;position:relative;overflow:hidden}
header,.list,.hero{padding-inline:16px}
header{display:flex;align-items:center;justify-content:space-between}
.brand b{font-size:1.7rem;font-weight:700;letter-spacing:1px;border-bottom:4px solid var(--blue);line-height:1.1;padding-bottom:1px}
.tabs{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:2px}
.tab{border:0;background:none;color:var(--ink);font:600 .95rem inherit;font-family:inherit;display:flex;align-items:center;gap:8px;padding:4px 16px 4px 5px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.tab img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.tab.on{background:var(--blue);color:#fff}
.hero h1{font-size:2.1rem;font-weight:700;line-height:1.2;letter-spacing:-.3px}
.hero p{color:var(--mute);font-size:.95rem;margin-top:6px}
.stagewrap{position:relative;--ug:0;margin-inline:12px}
.stagewrap::after{content:"";position:absolute;left:14%;right:14%;bottom:-12px;height:20px;border-radius:50%;background:radial-gradient(closest-side,rgba(5,102,232,.9),rgba(5,102,232,0));opacity:var(--ug);filter:blur(5px);transition:opacity .25s;pointer-events:none;display:none}
.stagewrap.ext::after{display:block}
.stage{--d:1;position:relative;border-radius:16px;overflow:hidden;background:#c9cacd;transition:background .45s ease;aspect-ratio:1023/447}
.stage.ext{aspect-ratio:2384/1008;background:#fafafa;box-shadow:0 0 0 1px var(--line)}
.stage.ext.night{background:#04060c;box-shadow:none}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.scene img,.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.scene .lay{mix-blend-mode:lighten;opacity:0;transition:opacity .15s ease}
.slide{position:absolute;inset:0;opacity:0;z-index:1;pointer-events:none;filter:blur(10px);transform:scale(.96)}
.slide.on{opacity:1;z-index:2;filter:none;transform:none;transition:opacity .4s ease-out,filter .45s ease-out,transform .5s cubic-bezier(.2,.8,.2,1)}
.slide.out{opacity:1;z-index:1;filter:none;transform:none}
.slide .nt{opacity:0;transition:opacity .4s ease}
.slide.night .nt{opacity:1}
.slide .lay{transition:opacity .2s ease}
.slide.night .lay,.slide.night .hoodOn{opacity:0!important}
.hoodOn{opacity:0;transition:opacity .25s ease}
.dots{position:absolute;inset-inline:0;bottom:8px;display:flex;justify-content:center;gap:6px;z-index:5}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(16,24,32,.25);transition:width .3s ease,background .3s}
.dots i.on{width:20px;background:var(--blue)}
.list{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:12px;flex:1}
.row{position:relative;overflow:hidden;background:var(--card);border-radius:16px;min-height:150px;cursor:pointer;transition:transform .12s,box-shadow .25s;touch-action:manipulation}
.row:active{transform:scale(.97)}
.row.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.fill{position:absolute;inset-inline:0;bottom:0;height:0;background:linear-gradient(180deg,#2c82f5,var(--blue) 30%);transition:height .18s ease-out}
.ct{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:18px}
.ct.w{color:#fff;clip-path:inset(100% 0 0 0);transition:clip-path .18s ease-out}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.bulb svg{width:34px;height:34px}
.val{font-weight:700;font-size:2rem;font-variant-numeric:tabular-nums;direction:ltr;line-height:1}
.val small{font-size:.9rem;opacity:.7;font-weight:600}
.name{font-weight:700;font-size:1.15rem;line-height:1.25}
.st{font-size:.88rem;opacity:.75;margin-top:2px}
.shade{position:absolute;inset:0;background:rgba(16,24,32,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;inset-inline:0;bottom:0;background:var(--sheet);border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:30}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-end}
.sh-top h2{font-size:1.3rem;font-weight:700}
.big{font-size:3.2rem;font-weight:700;direction:ltr;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:1.1rem;color:var(--mute)}
input[type=range]{direction:ltr;-webkit-appearance:none;appearance:none;width:100%;height:56px;background:transparent;margin:14px 0 8px;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--blue) var(--p),var(--card) var(--p))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--card)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--blue)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-13px;border-radius:50%;background:#fff;border:3px solid var(--blue);box-shadow:0 3px 10px rgba(16,24,32,.3)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--blue);box-shadow:0 3px 10px rgba(16,24,32,.3)}
input[type=range]:disabled{opacity:.35;pointer-events:none}
.chips{display:flex;justify-content:space-between;direction:ltr;gap:8px}
.chip{flex:1;border:0;background:var(--card);color:var(--ink);font:600 .95rem inherit;font-family:inherit;padding:12px 0;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--ink);color:#fff}
.night-row{display:none;align-items:center;justify-content:space-between;margin-top:18px;padding:15px 18px;background:var(--card);border-radius:16px;cursor:pointer;font-weight:600;font-size:1rem}
.night-row.show{display:flex}
.sw{width:48px;height:28px;border-radius:14px;background:#c3c8ce;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.night-row.on .sw{background:var(--blue)}
.night-row.on .sw::after{inset-inline-start:23px}
.done{width:100%;margin-top:16px;border:0;background:var(--blue);color:#fff;font:700 1.1rem inherit;font-family:inherit;padding:16px;border-radius:999px;cursor:pointer;transition:transform .12s,background .2s}
.done:active{transform:scale(.98);background:var(--blue2)}
@media (min-width:600px){.app{padding-top:24px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><b>64</b></div>
    <div class="tabs">
      <button class="tab on" id="tab-cabin"><img id="ti" alt=""><span>الداخل</span></button>
      <button class="tab" id="tab-ext"><img id="to" alt=""><span>الخارج</span></button>
    </div>
  </header>

  <div class="hero"><h1>تحكم بإضاءة مركبتك</h1><p>اضغط للتشغيل أو الإيقاف، واضغط مطولاً لضبط النسبة</p></div>

  <div class="stagewrap" id="wrap">
    <div class="stage" id="stage">
      <div class="scene on" id="sc-cabin"></div>
      <div class="scene" id="sc-ext"></div>
      <div class="dots" id="dots" style="display:none"><i></i><i></i><i></i></div>
    </div>
  </div>

  <div class="list" id="list"></div>
  

  <div class="shade" id="shade"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sh-top"><h2 id="shTitle"></h2><div class="big"><span id="shVal">0</span><small>%</small></div></div>
    <input type="range" id="rng" min="0" max="100" value="0" aria-label="نسبة الإضاءة">
    <div class="chips" id="chips"></div>
    <div class="night-row" id="night"><span>عرض الوضع الليلي</span><span class="sw"></span></div>
    <button class="done" id="done">تم</button>
  </div>
</div>

const S={
  cabin:[{n:'إضاءة الأقدام',v:67,img:'footwell'},{n:'الإضاءة الوسطى',v:34,img:'center'},{n:'الإضاءة اليسرى',v:100,img:'left'},{n:'الإضاءة اليمنى',v:0,img:'right'}],
  ext:[{n:'الإضاءة اليسرى',v:100,slide:0,night:false},{n:'الإضاءة اليمنى',v:100,slide:1,night:false},{n:'إضاءة غطاء المحرك',v:0,slide:2,night:false},{n:'إضاءة أسفل السيارة',v:0}]
};
Object.values(S).flat().forEach(l=>l.last=l.v||100);
let tab='cabin',cur=0,openIdx=null;

/* ---- build scenes ---- */
$('#sc-cabin').innerHTML=`<img src="${IMG.cabin}" alt="">`+S.cabin.map((l,i)=>`<img class="lay" data-i="${i}" src="${IMG[l.img]}" alt="">`).join('');
const slides=[
 {base:'rbase',lay:'rlayL',n:'n1'},{base:'fbase',lay:'rlayR',n:'n2'},{base:'hoodOff',lay:'hoodLay',n:'n3',on:'hoodOn'}
];
$('#sc-ext').innerHTML=slides.map((s,i)=>`<div class="slide" data-s="${i}"><img src="${IMG[s.base]}" alt="">${s.on?`<img class="hoodOn" src="${IMG[s.on]}" alt="">`:''}<img class="lay" src="${IMG[s.lay]}" alt=""><img class="nt" src="${IMG[s.n]}" alt=""></div>`).join('');

/* ---- build list ---- */
function buildList(){
  const L=$('#list');L.innerHTML='';
  S[tab].forEach((l,i)=>{
    const r=document.createElement('div');r.className='row';
    const inner=`<div class="top"><div class="bulb">${BULB}</div><div class="val"><span>0</span><small>%</small></div></div><div><div class="name">${l.n}</div><div class="st"></div></div>`;
    r.innerHTML=`<div class="fill"></div><div class="ct">${inner}</div><div class="ct w">${inner}</div>`;
    let t=null,long=false;
    r.addEventListener('pointerdown',()=>{long=false;clearTimeout(t);t=setTimeout(()=>{long=true;vib(45);openSheet(i)},450)});
    r.addEventListener('pointerup',()=>{clearTimeout(t);if(!long)toggle(i)});
    ['pointerleave','pointercancel'].forEach(ev=>r.addEventListener(ev,()=>clearTimeout(t)));
    r.addEventListener('contextmenu',e=>e.preventDefault());
    L.appendChild(r);
  });
  render();
}
function toggle(i){
  vib(35);const l=S[tab][i];
  if(l.night){return}
  if(l.v>0){l.last=l.v;l.v=0}else l.v=l.last||100;
  if(l.slide!==undefined)showSlide(l.slide);
  render();
}
function showSlide(n){
  const all=document.querySelectorAll('.slide'),target=all[n],prev=document.querySelector('.slide.on');
  if(prev!==target){
    $('#stage').style.setProperty('--d',n>cur?1:-1);
    if(prev){prev.classList.remove('on');prev.classList.add('out');setTimeout(()=>prev.classList.remove('out'),460)}
    target.classList.remove('out');target.classList.add('on');
  }
  cur=n;
  document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i===n));
  render();
}
function render(){
  const list=S[tab];
  document.querySelectorAll('#list .row').forEach((r,i)=>{
    const l=list[i];
    r.classList.toggle('lit',l.v>0);
    r.classList.toggle('sel',tab==='ext'&&l.slide!==undefined&&l.slide===cur);
    r.querySelector('.fill').style.height=l.v+'%';
    r.querySelector('.ct.w').style.clipPath=`inset(${100-l.v}% 0 0 0)`;
    r.querySelectorAll('.val span').forEach(s=>s.textContent=l.v);
    r.querySelectorAll('.st').forEach(s=>s.textContent=l.v>0?'مضاءة':'مطفأة');
  });
  if(tab==='cabin'){
    document.querySelectorAll('#sc-cabin .lay').forEach(im=>im.style.opacity=S.cabin[im.dataset.i].v/100);
  }else{
    const e=S.ext;
    [0,1,2].forEach(i=>{
      const s=document.querySelector(`.slide[data-s="${i}"]`);
      s.classList.toggle('night',!!e[i].night);
      s.querySelector('.lay').style.opacity=e[i].v/100;
      const h=s.querySelector('.hoodOn');if(h)h.style.opacity=e[i].v>0?1:0;
    });
    $('#stage').classList.toggle('night',!!(e[cur]&&e[cur].night));
    $('#wrap').style.setProperty('--ug',e[3].v/100);
  }
}
function setTab(t){
  vib(40);tab=t;
  $('#tab-cabin').classList.toggle('on',t==='cabin');$('#tab-ext').classList.toggle('on',t==='ext');
  $('#sc-cabin').classList.toggle('on',t==='cabin');$('#sc-ext').classList.toggle('on',t==='ext');
  $('#stage').classList.toggle('ext',t==='ext');$('#wrap').classList.toggle('ext',t==='ext');
  $('#dots').style.display=t==='ext'?'flex':'none';
  if(t==='ext'){showSlide(cur)}
  buildList();
}
$('#tab-cabin').onclick=()=>setTab('cabin');
$('#tab-ext').onclick=()=>setTab('ext');

/* ---- sheet ---- */
const rng=$('#rng');
$('#chips').innerHTML=[0,25,50,75,100].map(v=>`<button class="chip" data-v="${v}">${v}</button>`).join('');
function paint(){
  const l=S[tab][openIdx];
  $('#shVal').textContent=l.v;rng.value=l.v;rng.style.setProperty('--p',l.v+'%');
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',+c.dataset.v===+l.v));
  rng.disabled=!!l.night;
  $('#night').classList.toggle('on',!!l.night);
}
function openSheet(i){
  openIdx=i;const l=S[tab][i];
  $('#shTitle').textContent=l.n;
  $('#night').classList.toggle('show',tab==='ext'&&l.slide!==undefined);
  if(l.slide!==undefined)showSlide(l.slide);
  paint();render();
  $('#shade').classList.add('on');$('#sheet').classList.add('on');
}
function closeSheet(){
  if(openIdx===null)return;vib(35);
  const l=S[tab][openIdx];
  if(l.night){l.night=false;}
  openIdx=null;
  $('#shade').classList.remove('on');$('#sheet').classList.remove('on');render();
}
rng.addEventListener('input',()=>{
  const l=S[tab][openIdx];l.v=+rng.value;if(l.v>0)l.last=l.v;
  vib(12);paint();render();
});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  const l=S[tab][openIdx];if(l.night)return;vib(20);
  l.v=+c.dataset.v;if(l.v>0)l.last=l.v;paint();render();
});
$('#night').onclick=()=>{
  vib(40);const l=S[tab][openIdx];l.night=!l.night;
  if(l.night){l.v=100;}
  paint();render();
};
$('#done').onclick=closeSheet;
$('#shade').onclick=closeSheet;
buildList();
</script>
</body>
</html>
